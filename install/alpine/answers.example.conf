# Answer file for `setup-alpine -f`, used by cis-install.sh.
# Copy to answers.conf (git-ignored), fill in the <PLACEHOLDERS>, and pass it
# (or its URL) to cis-install.sh. setup-alpine sources this file as shell.
#
# No passwords here: setup-alpine prompts for the root password, and
# cis-install.sh prompts for the user's password at the end (needed for doas).

# Finnish layout with Windows keys (/usr/share/bkeymaps/fi/fi-winkeys)
KEYMAPOPTS="fi fi-winkeys"
HOSTNAMEOPTS="<HOSTNAME>"
DEVDOPTS=mdev

INTERFACESOPTS="auto lo
iface lo inet loopback

auto eth0
iface eth0 inet dhcp
"

# DNS comes from DHCP
DNSOPTS=none
TIMEZONEOPTS="Europe/Helsinki"
# Not a setup-alpine option: cis-install.sh installs musl-locales and sets
# LANG in /etc/profile.d/20locale.sh. Use "none" to skip.
LOCALEOPTS="fi_FI.UTF-8"
PROXYOPTS=none

# First mirror, with the community repository enabled
APKREPOSOPTS="-1 -c"

# -a: admin user (wheel group + doas). No -u, so a password gets set.
USEROPTS="-a -g audio,input,video,netdev <USERNAME>"
# Public key, or a URL such as https://github.com/<GITHUB_USER>.keys
USERSSHKEY="<SSH_PUBLIC_KEY_OR_URL>"

# No ROOTSSHKEY: root never logs in over SSH
SSHDOPTS=openssh
NTPOPTS=chrony

# Install onto the filesystems cis-install.sh mounted under /mnt
DISKOPTS="-m sys /mnt"
LBUOPTS=none
APKCACHEOPTS=none

# Kernel command line of the installed system: AppArmor (matches
# ansible/alpine/hardening.yml) and audit from early boot (CIS).
export KERNELOPTS="quiet lsm=landlock,lockdown,yama,integrity,apparmor audit=1 audit_backlog_limit=8192"
