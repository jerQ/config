---
# OS-independent LSP servers used by neovim-minimal/init.lua.
# clangd comes from the OS package manager (see <os>/neovim.yml).
- name: Install LSP servers (pyright, lua-language-server)
  hosts: all
  become: true

  vars:
    lua_ls_install_dir: /usr/local/lua-language-server
    lua_ls_arch_map:
      x86_64: x64
      aarch64: arm64

  tasks:
    - name: Install pyright via pip
      pip:
        name: pyright
        executable: pip3
        extra_args: --break-system-packages

    - name: Fetch latest lua-language-server release
      uri:
        url: https://api.github.com/repos/LuaLS/lua-language-server/releases/latest
        return_content: true
      register: lua_ls_release

    - name: Set lua-language-server version and arch facts
      set_fact:
        lua_ls_version: "{{ lua_ls_release.json.tag_name }}"
        lua_ls_arch: "{{ lua_ls_arch_map[ansible_facts['architecture']] }}"

    - name: Create lua-language-server install directory
      file:
        path: "{{ lua_ls_install_dir }}"
        state: directory
        mode: "0755"

    - name: Download and extract lua-language-server
      unarchive:
        src: "https://github.com/LuaLS/lua-language-server/releases/download/{{ lua_ls_version }}/lua-language-server-{{ lua_ls_version }}-linux-{{ lua_ls_arch }}.tar.gz"
        dest: "{{ lua_ls_install_dir }}"
        remote_src: true

    - name: Symlink lua-language-server into PATH
      file:
        src: "{{ lua_ls_install_dir }}/bin/lua-language-server"
        dest: /usr/local/bin/lua-language-server
        state: link
