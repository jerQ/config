---
# Optional security hardening for Debian/Ubuntu. Not part of site.yml — run on demand.
# Every section is tagged, so you can pick only what you need:
#   ansible-playbook -i inventory.ini debian/hardening.yml --tags sysctl,firewall
# Tags: apparmor, audit, sysctl, modules, mounts, firewall, ssh, fail2ban, autoupdate
# Try it first with --check --diff. Keep a second SSH session open while
# applying the ssh/firewall tags. A reboot is needed for audit=1.
- name: Harden Debian/Ubuntu
  hosts: all
  become: true

  vars:
    # Make audit rules immutable (-e 2) until the next reboot.
    audit_immutable: false

    blacklisted_modules: [dccp, sctp, rds, tipc, cramfs, freevxfs, jffs2, hfs, hfsplus]

    # Inbound TCP ports to allow. Keep your SSH port here!
    firewall_allowed_tcp: [22]
    # Rootful podman containers need forwarding: set to "accept" on those hosts.
    firewall_forward_policy: drop

    fail2ban_bantime: 1h
    fail2ban_findtime: 10m
    fail2ban_maxretry: 5

    audit_arch: "b{{ ansible_facts['userspace_bits'] | default('64') }}"
    reboot_required: false

  tasks:
    # ------------------------------------------------------------------ apparmor
    # AppArmor is enabled in Debian's and Ubuntu's kernels by default, so no
    # kernel cmdline change is needed — only the profiles and the service.
    - name: AppArmor
      tags: [apparmor]
      block:
        - name: Install AppArmor and profiles
          apt:
            name: [apparmor, apparmor-utils, apparmor-profiles]
            state: present
            update_cache: true

        - name: Enable and start AppArmor
          service:
            name: apparmor
            enabled: true
            state: started

        - name: Check that the kernel has AppArmor enabled
          stat:
            path: /sys/kernel/security/apparmor
          register: apparmor_lsm

        - name: Warn when the kernel has AppArmor disabled
          debug:
            msg: "AppArmor is not active in this kernel (e.g. Raspberry Pi OS). Add 'apparmor=1 security=apparmor' to the kernel command line and reboot."
          when: not apparmor_lsm.stat.exists

    # --------------------------------------------------------------------- audit
    - name: Audit
      tags: [audit]
      block:
        - name: Install auditd
          apt:
            name: auditd
            state: present
            update_cache: true

        - name: Write audit rules
          copy:
            dest: /etc/audit/rules.d/50-hardening.rules
            mode: "0640"
            content: |
              # Managed by ansible (debian/hardening.yml)
              # Identity and privilege
              -w /etc/passwd -p wa -k identity
              -w /etc/shadow -p wa -k identity
              -w /etc/group -p wa -k identity
              -w /etc/gshadow -p wa -k identity
              -w /etc/sudoers -p wa -k privilege
              -w /etc/sudoers.d/ -p wa -k privilege
              # SSH config
              -w /etc/ssh/sshd_config -p wa -k sshd
              -w /etc/ssh/sshd_config.d/ -p wa -k sshd
              # Package sources and scheduled jobs
              -w /etc/apt/sources.list -p wa -k apt
              -w /etc/apt/sources.list.d/ -p wa -k apt
              -w /etc/crontab -p wa -k cron
              -w /etc/cron.d/ -p wa -k cron
              # Kernel modules
              -a always,exit -F arch={{ audit_arch }} -S init_module,finit_module,delete_module -k modules
              # Time changes
              -a always,exit -F arch={{ audit_arch }} -S adjtimex,settimeofday,clock_settime -k time
              # Mounts and hostname
              -a always,exit -F arch={{ audit_arch }} -S mount -k mount
              -a always,exit -F arch={{ audit_arch }} -S sethostname -k hostname
              {% if audit_immutable | bool %}
              # Lock rules until reboot
              -e 2
              {% endif %}
          notify: Load audit rules

        - name: Enable and start auditd
          service:
            name: auditd
            enabled: true
            state: started

        # audit=1 lets processes started before auditd be audited too.
        - name: Detect bootloader config
          stat:
            path: "{{ item }}"
          loop:
            - /etc/default/grub
            - /boot/firmware/cmdline.txt
            - /boot/cmdline.txt
          register: bootcfg

        - name: Add audit=1 to kernel cmdline (GRUB)
          replace:
            path: /etc/default/grub
            regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")((?:(?!audit=)[^"])*)"$'
            replace: '\1\2 audit=1"'
          when: bootcfg.results[0].stat.exists
          register: cmdline_grub
          notify: Update GRUB config

        - name: Add audit=1 to kernel cmdline (Raspberry Pi)
          replace:
            path: "{{ (bootcfg.results[1].stat.exists) | ternary('/boot/firmware/cmdline.txt', '/boot/cmdline.txt') }}"
            regexp: '^((?:(?!audit=).)+?)[ \t]*$'
            replace: '\1 audit=1'
          when:
            - not bootcfg.results[0].stat.exists
            - bootcfg.results[1].stat.exists or bootcfg.results[2].stat.exists
          register: cmdline_rpi

        - name: Mark reboot as required
          set_fact:
            reboot_required: true
          when: (cmdline_grub is changed) or (cmdline_rpi is changed)

    # -------------------------------------------------------------------- sysctl
    - name: Write sysctl hardening
      tags: [sysctl]
      copy:
        dest: /etc/sysctl.d/90-hardening.conf
        mode: "0644"
        content: |
          # Managed by ansible (debian/hardening.yml)
          # User namespaces stay enabled: rootless podman needs them.
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.unprivileged_bpf_disabled = 1
          net.core.bpf_jit_harden = 2
          kernel.yama.ptrace_scope = 1
          kernel.kexec_load_disabled = 1
          fs.protected_hardlinks = 1
          fs.protected_symlinks = 1
          fs.protected_fifos = 2
          fs.protected_regular = 2
          fs.suid_dumpable = 0

          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.default.log_martians = 1
          net.ipv4.tcp_syncookies = 1
          net.ipv4.icmp_echo_ignore_broadcasts = 1

          net.ipv6.conf.all.accept_redirects = 0
          net.ipv6.conf.default.accept_redirects = 0
          net.ipv6.conf.all.accept_source_route = 0
          net.ipv6.conf.default.accept_source_route = 0
      notify: Reload sysctl

    # ------------------------------------------------------------------- modules
    - name: Block unused kernel modules
      tags: [modules]
      copy:
        dest: /etc/modprobe.d/hardening.conf
        mode: "0644"
        content: |
          # Managed by ansible (debian/hardening.yml)
          {% for mod in blacklisted_modules %}
          install {{ mod }} /bin/false
          {% endfor %}

    # -------------------------------------------------------------------- mounts
    - name: Mount /dev/shm with nosuid,nodev,noexec
      tags: [mounts]
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+/dev/shm\s'
        line: "tmpfs /dev/shm tmpfs nosuid,nodev,noexec 0 0"
      notify: Remount /dev/shm

    # ------------------------------------------------------------------ firewall
    - name: Firewall
      tags: [firewall]
      block:
        - name: Gather service facts
          service_facts:

        # Two firewall managers fighting over nftables is worse than one.
        - name: Refuse to run when ufw or firewalld is active
          assert:
            that:
              - ansible_facts.services['ufw.service'].state | default('') != 'running'
              - ansible_facts.services['firewalld.service'].state | default('') != 'running'
            fail_msg: "ufw or firewalld is active. Disable it first, or skip the firewall tag."

        - name: Install nftables
          apt:
            name: nftables
            state: present
            update_cache: true

        # Only our own table is replaced on reload, so fail2ban's and
        # podman's tables are left alone.
        - name: Write nftables ruleset
          copy:
            dest: /etc/nftables.conf
            mode: "0755"
            validate: nft -c -f %s
            content: |
              #!/usr/sbin/nft -f
              # Managed by ansible (debian/hardening.yml)
              table inet filter
              delete table inet filter

              table inet filter {
                chain input {
                  type filter hook input priority filter; policy drop;
                  ct state established,related accept
                  ct state invalid drop
                  iif "lo" accept
                  icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept
                  meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
              {% if firewall_allowed_tcp | length > 0 %}
                  tcp dport { {{ firewall_allowed_tcp | join(', ') }} } accept
              {% endif %}
                }
                chain forward {
                  type filter hook forward priority filter; policy {{ firewall_forward_policy }};
                }
                chain output {
                  type filter hook output priority filter; policy accept;
                }
              }
          notify: Reload nftables

        - name: Enable and start nftables
          service:
            name: nftables
            enabled: true
            state: started

    # ----------------------------------------------------------------------- ssh
    - name: SSH
      tags: [ssh]
      block:
        # Lockout guard: key-only login needs a key to log in with.
        - name: Check authorized_keys of the login user
          stat:
            path: ~/.ssh/authorized_keys
          become: false
          register: authorized_keys

        - name: Refuse to disable password login without authorized_keys
          assert:
            that:
              - authorized_keys.stat.exists
              - authorized_keys.stat.size > 0
            fail_msg: "~/.ssh/authorized_keys is missing or empty. Add a key first, or you'll be locked out."

        - name: Install OpenSSH server
          apt:
            name: openssh-server
            state: present
            update_cache: true

        # sshd uses the first value it sees, so the drop-ins must be included first.
        # Debian already has this line at the top; this only guards older configs.
        - name: Include sshd_config.d at the top of sshd_config
          lineinfile:
            path: /etc/ssh/sshd_config
            line: "Include /etc/ssh/sshd_config.d/*.conf"
            insertbefore: BOF
            validate: sshd -t -f %s
          notify: Restart sshd

        - name: Write sshd hardening drop-in
          copy:
            dest: /etc/ssh/sshd_config.d/10-hardening.conf
            mode: "0644"
            validate: sshd -t -f %s
            content: |
              # Managed by ansible (debian/hardening.yml)
              PermitRootLogin no
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              PubkeyAuthentication yes
              X11Forwarding no
              MaxAuthTries 3
              LoginGraceTime 30
          notify: Restart sshd

        - name: Enable and start sshd
          service:
            name: ssh
            enabled: true
            state: started

    # ------------------------------------------------------------------ fail2ban
    - name: Fail2ban
      tags: [fail2ban]
      block:
        # Debian 12+ has no /var/log/auth.log by default, so read the journal.
        - name: Install fail2ban
          apt:
            name: [fail2ban, python3-systemd]
            state: present
            update_cache: true

        - name: Configure sshd jail
          copy:
            dest: /etc/fail2ban/jail.d/sshd.local
            mode: "0644"
            content: |
              # Managed by ansible (debian/hardening.yml)
              [sshd]
              enabled = true
              backend = systemd
              banaction = nftables-multiport
              bantime = {{ fail2ban_bantime }}
              findtime = {{ fail2ban_findtime }}
              maxretry = {{ fail2ban_maxretry }}
          notify: Restart fail2ban

        - name: Enable and start fail2ban
          service:
            name: fail2ban
            enabled: true
            state: started

    # ---------------------------------------------------------------- autoupdate
    # unattended-upgrades installs security updates only (its default origins).
    - name: Automatic updates
      tags: [autoupdate]
      block:
        - name: Install unattended-upgrades
          apt:
            name: unattended-upgrades
            state: present
            update_cache: true

        - name: Enable daily update and unattended upgrade
          copy:
            dest: /etc/apt/apt.conf.d/20auto-upgrades
            mode: "0644"
            content: |
              // Managed by ansible (debian/hardening.yml)
              APT::Periodic::Update-Package-Lists "1";
              APT::Periodic::Unattended-Upgrade "1";

    # ------------------------------------------------------------------- summary
    - name: Reboot reminder
      tags: [always]
      debug:
        msg: "Kernel command line changed: reboot to enable audit=1."
      when: reboot_required | bool

  handlers:
    - name: Update GRUB config
      command: update-grub

    - name: Load audit rules
      command: augenrules --load

    - name: Reload sysctl
      command: sysctl -e -p /etc/sysctl.d/90-hardening.conf

    - name: Remount /dev/shm
      command: mount -o remount,nosuid,nodev,noexec /dev/shm

    - name: Reload nftables
      command: nft -f /etc/nftables.conf

    - name: Restart sshd
      service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      service:
        name: fail2ban
        state: restarted
