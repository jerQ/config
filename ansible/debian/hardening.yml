---
# Optional security hardening for Debian/Ubuntu. Not part of site.yml — run on demand.
# Every section is tagged, so you can pick only what you need:
#   ansible-playbook -i inventory.ini debian/hardening.yml --tags sysctl,firewall
# Tags: apparmor, audit, sysctl, modules, mounts, firewall, ssh, fail2ban, autoupdate
# Try it first with --check --diff. Keep a second SSH session open while
# applying the ssh/firewall tags. A reboot is needed for audit=1.
- name: Harden Debian/Ubuntu
  hosts: all
  become: true

  vars:
    # Make audit rules immutable (-e 2) until the next reboot.
    audit_immutable: false
    # High-volume telemetry (every exec, outbound connection, failed file
    # access, file deletion). Only useful when logs are shipped to a SIEM.
    audit_telemetry: false
    # Log every 32-bit syscall. Turn off on hosts that run 32-bit software.
    audit_32bit_abi: true
    # Rules about human activity match login UIDs from here up.
    audit_uid_min: 1000
    audit_kernel_args: [audit=1, audit_backlog_limit=8192]
    # auditd.conf: 20 MB x 10 logs = 200 MB. /var/log/audit usually shares
    # the root filesystem here. Warn via syslog at 150 MB free, suspend
    # logging at 75 MB free.
    audit_max_log_file: 20
    audit_num_logs: 10
    audit_space_left: 150
    audit_admin_space_left: 75

    # File and directory watches (perm defaults to wa). A watch is skipped when
    # its directory doesn't exist. Writes to /usr, /bin and /boot are
    # deliberately not watched: every apt upgrade would flood the log.
    # `debsums -c` checks installed files against the packages instead.
    audit_watches:
      # Accounts and privilege
      - { path: /etc/passwd, key: identity }
      - { path: /etc/shadow, key: identity }
      - { path: /etc/group, key: identity }
      - { path: /etc/gshadow, key: identity }
      - { path: /etc/subuid, key: identity }
      - { path: /etc/subgid, key: identity }
      - { path: /etc/sudoers, key: privilege }
      - { path: /etc/sudoers.d, dir: true, key: privilege }
      - { path: /etc/login.defs, key: login }
      - { path: /etc/securetty, key: login }
      - { path: /etc/pam.d, dir: true, key: pam }
      - { path: /etc/security, dir: true, key: pam }
      # SSH, including host keys and root's authorized_keys
      - { path: /etc/ssh, dir: true, key: sshd }
      - { path: /root/.ssh, dir: true, key: rootkey }
      # Audit itself: also reads of the logs
      - { path: /var/log/audit, dir: true, perm: rwa, key: auditlog }
      - { path: /etc/audit, dir: true, key: auditconfig }
      # Kernel parameters and modules
      - { path: /etc/sysctl.conf, key: sysctl }
      - { path: /etc/sysctl.d, dir: true, key: sysctl }
      - { path: /etc/modprobe.d, dir: true, key: modprobe }
      - { path: /etc/modules, key: modprobe }
      - { path: /etc/modules-load.d, dir: true, key: modprobe }
      # Boot, init and services
      - { path: /etc/systemd, dir: true, key: systemd }
      - { path: /etc/init.d, dir: true, key: init }
      - { path: /etc/rc.local, key: init }
      - { path: /etc/default, dir: true, key: bootloader }
      - { path: /boot/firmware/cmdline.txt, key: bootloader }
      - { path: /etc/fstab, key: fstab }
      - { path: /etc/udev/rules.d, dir: true, key: udev }
      # Scheduled jobs
      - { path: /etc/crontab, key: cron }
      - { path: /etc/cron.d, dir: true, key: cron }
      - { path: /etc/cron.hourly, dir: true, key: cron }
      - { path: /etc/cron.daily, dir: true, key: cron }
      - { path: /etc/cron.weekly, dir: true, key: cron }
      - { path: /etc/cron.monthly, dir: true, key: cron }
      - { path: /var/spool/cron, dir: true, key: cron }
      - { path: /etc/at.allow, key: cron }
      - { path: /etc/at.deny, key: cron }
      # Packages
      - { path: /etc/apt, dir: true, key: apt }
      # Shells, environment and library search path
      - { path: /etc/profile, key: shell_profiles }
      - { path: /etc/profile.d, dir: true, key: shell_profiles }
      - { path: /etc/bash.bashrc, key: shell_profiles }
      - { path: /etc/zsh, dir: true, key: shell_profiles }
      - { path: /etc/shells, key: shell_profiles }
      - { path: /etc/environment, key: shell_profiles }
      - { path: /etc/ld.so.conf, key: libpath }
      - { path: /etc/ld.so.conf.d, dir: true, key: libpath }
      - { path: /etc/ld.so.preload, key: libpath }
      # Network and firewall
      - { path: /etc/hosts, key: network }
      - { path: /etc/hostname, key: network }
      - { path: /etc/resolv.conf, key: network }
      - { path: /etc/network, dir: true, key: network }
      - { path: /etc/netplan, dir: true, key: network }
      - { path: /etc/NetworkManager, dir: true, key: network }
      - { path: /etc/nftables.conf, key: firewall }
      - { path: /etc/fail2ban, dir: true, key: firewall }
      # Mandatory access control
      - { path: /etc/apparmor, dir: true, key: mac_policy }
      - { path: /etc/apparmor.d, dir: true, key: mac_policy }
      # Time zone
      - { path: /etc/localtime, key: localtime }

    blacklisted_modules: [dccp, sctp, rds, tipc, cramfs, freevxfs, jffs2, hfs, hfsplus]

    # Inbound TCP ports to allow. Keep your SSH port here!
    firewall_allowed_tcp: [22]
    # Rootful podman containers need forwarding: set to "accept" on those hosts.
    firewall_forward_policy: drop

    fail2ban_bantime: 1h
    fail2ban_findtime: 10m
    fail2ban_maxretry: 5

    audit_arch: "b{{ ansible_facts['userspace_bits'] | default('64') }}"
    reboot_required: false

  tasks:
    # ------------------------------------------------------------------ apparmor
    # AppArmor is enabled in Debian's and Ubuntu's kernels by default, so no
    # kernel cmdline change is needed — only the profiles and the service.
    - name: AppArmor
      tags: [apparmor]
      block:
        - name: Install AppArmor and profiles
          apt:
            name: [apparmor, apparmor-utils, apparmor-profiles]
            state: present
            update_cache: true

        - name: Enable and start AppArmor
          service:
            name: apparmor
            enabled: true
            state: started

        - name: Check that the kernel has AppArmor enabled
          stat:
            path: /sys/kernel/security/apparmor
          register: apparmor_lsm

        - name: Warn when the kernel has AppArmor disabled
          debug:
            msg: "AppArmor is not active in this kernel (e.g. Raspberry Pi OS). Add 'apparmor=1 security=apparmor' to the kernel command line and reboot."
          when: not apparmor_lsm.stat.exists

    # -------------------------------------------------------------------- sysctl
    - name: Write sysctl hardening
      tags: [sysctl]
      copy:
        dest: /etc/sysctl.d/90-hardening.conf
        mode: "0644"
        content: |
          # Managed by ansible (debian/hardening.yml)
          # User namespaces stay enabled: rootless podman needs them.
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.unprivileged_bpf_disabled = 1
          net.core.bpf_jit_harden = 2
          kernel.yama.ptrace_scope = 1
          kernel.kexec_load_disabled = 1
          fs.protected_hardlinks = 1
          fs.protected_symlinks = 1
          fs.protected_fifos = 2
          fs.protected_regular = 2
          fs.suid_dumpable = 0

          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.default.log_martians = 1
          net.ipv4.tcp_syncookies = 1
          net.ipv4.icmp_echo_ignore_broadcasts = 1

          net.ipv6.conf.all.accept_redirects = 0
          net.ipv6.conf.default.accept_redirects = 0
          net.ipv6.conf.all.accept_source_route = 0
          net.ipv6.conf.default.accept_source_route = 0
      notify: Reload sysctl

    # ------------------------------------------------------------------- modules
    - name: Block unused kernel modules
      tags: [modules]
      copy:
        dest: /etc/modprobe.d/hardening.conf
        mode: "0644"
        content: |
          # Managed by ansible (debian/hardening.yml)
          {% for mod in blacklisted_modules %}
          install {{ mod }} /bin/false
          {% endfor %}

    # -------------------------------------------------------------------- mounts
    - name: Mount /dev/shm with nosuid,nodev,noexec
      tags: [mounts]
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+/dev/shm\s'
        line: "tmpfs /dev/shm tmpfs nosuid,nodev,noexec 0 0"
      notify: Remount /dev/shm

    # ------------------------------------------------------------------ firewall
    - name: Firewall
      tags: [firewall]
      block:
        - name: Gather service facts
          service_facts:

        # Two firewall managers fighting over nftables is worse than one.
        - name: Refuse to run when ufw or firewalld is active
          assert:
            that:
              - ansible_facts.services['ufw.service'].state | default('') != 'running'
              - ansible_facts.services['firewalld.service'].state | default('') != 'running'
            fail_msg: "ufw or firewalld is active. Disable it first, or skip the firewall tag."

        - name: Install nftables
          apt:
            name: nftables
            state: present
            update_cache: true

        # Only our own table is replaced on reload, so fail2ban's and
        # podman's tables are left alone.
        - name: Write nftables ruleset
          copy:
            dest: /etc/nftables.conf
            mode: "0755"
            validate: nft -c -f %s
            content: |
              #!/usr/sbin/nft -f
              # Managed by ansible (debian/hardening.yml)
              table inet filter
              delete table inet filter

              table inet filter {
                chain input {
                  type filter hook input priority filter; policy drop;
                  ct state established,related accept
                  ct state invalid drop
                  iif "lo" accept
                  icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept
                  meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
              {% if firewall_allowed_tcp | length > 0 %}
                  tcp dport { {{ firewall_allowed_tcp | join(', ') }} } accept
              {% endif %}
                }
                chain forward {
                  type filter hook forward priority filter; policy {{ firewall_forward_policy }};
                }
                chain output {
                  type filter hook output priority filter; policy accept;
                }
              }
          notify: Reload nftables

        - name: Enable and start nftables
          service:
            name: nftables
            enabled: true
            state: started

    # ----------------------------------------------------------------------- ssh
    - name: SSH
      tags: [ssh]
      block:
        # Lockout guard: key-only login needs a key to log in with.
        - name: Check authorized_keys of the login user
          stat:
            path: ~/.ssh/authorized_keys
          become: false
          register: authorized_keys

        - name: Refuse to disable password login without authorized_keys
          assert:
            that:
              - authorized_keys.stat.exists
              - authorized_keys.stat.size > 0
            fail_msg: "~/.ssh/authorized_keys is missing or empty. Add a key first, or you'll be locked out."

        - name: Install OpenSSH server
          apt:
            name: openssh-server
            state: present
            update_cache: true

        # sshd uses the first value it sees, so the drop-ins must be included first.
        # Debian already has this line at the top; this only guards older configs.
        - name: Include sshd_config.d at the top of sshd_config
          lineinfile:
            path: /etc/ssh/sshd_config
            line: "Include /etc/ssh/sshd_config.d/*.conf"
            insertbefore: BOF
            validate: sshd -t -f %s
          notify: Restart sshd

        - name: Write sshd hardening drop-in
          copy:
            dest: /etc/ssh/sshd_config.d/10-hardening.conf
            mode: "0644"
            validate: sshd -t -f %s
            content: |
              # Managed by ansible (debian/hardening.yml)
              PermitRootLogin no
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              PubkeyAuthentication yes
              X11Forwarding no
              MaxAuthTries 3
              LoginGraceTime 30
          notify: Restart sshd

        - name: Enable and start sshd
          service:
            name: ssh
            enabled: true
            state: started

    # ------------------------------------------------------------------ fail2ban
    - name: Fail2ban
      tags: [fail2ban]
      block:
        # Debian 12+ has no /var/log/auth.log by default, so read the journal.
        - name: Install fail2ban
          apt:
            name: [fail2ban, python3-systemd]
            state: present
            update_cache: true

        - name: Configure sshd jail
          copy:
            dest: /etc/fail2ban/jail.d/sshd.local
            mode: "0644"
            content: |
              # Managed by ansible (debian/hardening.yml)
              [sshd]
              enabled = true
              backend = systemd
              banaction = nftables-multiport
              bantime = {{ fail2ban_bantime }}
              findtime = {{ fail2ban_findtime }}
              maxretry = {{ fail2ban_maxretry }}
          notify: Restart fail2ban

        - name: Enable and start fail2ban
          service:
            name: fail2ban
            enabled: true
            state: started

    # ---------------------------------------------------------------- autoupdate
    # unattended-upgrades installs security updates only (its default origins).
    - name: Automatic updates
      tags: [autoupdate]
      block:
        - name: Install unattended-upgrades
          apt:
            name: unattended-upgrades
            state: present
            update_cache: true

        - name: Enable daily update and unattended upgrade
          copy:
            dest: /etc/apt/apt.conf.d/20auto-upgrades
            mode: "0644"
            content: |
              // Managed by ansible (debian/hardening.yml)
              APT::Periodic::Update-Package-Lists "1";
              APT::Periodic::Unattended-Upgrade "1";

    # --------------------------------------------------------------------- audit
    # Runs last: watches are only added for directories that exist, and the
    # sections above create some of them (/etc/fail2ban).
    - name: Audit
      tags: [audit]
      block:
        - name: Install auditd
          apt:
            name: auditd
            state: present
            update_cache: true

        - name: Check which watched directories exist
          stat:
            path: "{{ item.path if item.dir | default(false) else item.path | dirname }}"
          loop: "{{ audit_watches }}"
          loop_control:
            label: "{{ item.path }}"
          register: audit_watch_stat

        # The auditd package's own rules.d/audit.rules holds -D, -b and -f.
        - name: Write audit rules
          template:
            src: ../common/audit-hardening.rules.j2
            dest: /etc/audit/rules.d/50-hardening.rules
            mode: "0640"
          vars:
            audit_playbook: debian/hardening.yml
          notify: Load audit rules

        - name: Size audit log retention
          lineinfile:
            path: /etc/audit/auditd.conf
            regexp: '^{{ item.key }}\s*='
            line: "{{ item.key }} = {{ item.value }}"
          loop:
            - { key: max_log_file, value: "{{ audit_max_log_file }}" }
            - { key: num_logs, value: "{{ audit_num_logs }}" }
            - { key: max_log_file_action, value: ROTATE }
            - { key: space_left, value: "{{ audit_space_left }}" }
            - { key: space_left_action, value: SYSLOG }
            - { key: admin_space_left, value: "{{ audit_admin_space_left }}" }
            - { key: admin_space_left_action, value: SUSPEND }
          loop_control:
            label: "{{ item.key }}"
          notify: Reload auditd config

        - name: Enable and start auditd
          service:
            name: auditd
            enabled: true
            state: started

        # audit=1 lets processes started before auditd be audited too. Without
        # a bigger backlog, the kernel drops events from early boot.
        - name: Detect bootloader config
          stat:
            path: "{{ item }}"
          loop:
            - /etc/default/grub
            - /boot/firmware/cmdline.txt
            - /boot/cmdline.txt
          register: bootcfg

        - name: Add audit options to kernel cmdline (GRUB)
          replace:
            path: /etc/default/grub
            regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")((?:(?!{{ item.split("=")[0] }}=)[^"])*)"$'
            replace: '\1\2 {{ item }}"'
          loop: "{{ audit_kernel_args }}"
          when: bootcfg.results[0].stat.exists
          register: cmdline_grub
          notify: Update GRUB config

        - name: Add audit options to kernel cmdline (Raspberry Pi)
          replace:
            path: "{{ (bootcfg.results[1].stat.exists) | ternary('/boot/firmware/cmdline.txt', '/boot/cmdline.txt') }}"
            regexp: '^((?:(?!{{ item.split("=")[0] }}=).)+?)[ \t]*$'
            replace: '\1 {{ item }}'
          loop: "{{ audit_kernel_args }}"
          when:
            - not bootcfg.results[0].stat.exists
            - bootcfg.results[1].stat.exists or bootcfg.results[2].stat.exists
          register: cmdline_rpi

        - name: Mark reboot as required
          set_fact:
            reboot_required: true
          when: (cmdline_grub is changed) or (cmdline_rpi is changed)

    # ------------------------------------------------------------------- summary
    - name: Reboot reminder
      tags: [always]
      debug:
        msg: "Kernel command line changed: reboot to enable audit=1 and the audit backlog."
      when: reboot_required | bool

  handlers:
    - name: Update GRUB config
      command: update-grub

    - name: Load audit rules
      command: augenrules --load

    # SIGHUP makes auditd re-read auditd.conf
    - name: Reload auditd config
      command: pkill -HUP -x auditd

    - name: Reload sysctl
      command: sysctl -e -p /etc/sysctl.d/90-hardening.conf

    - name: Remount /dev/shm
      command: mount -o remount,nosuid,nodev,noexec /dev/shm

    - name: Reload nftables
      command: nft -f /etc/nftables.conf

    - name: Restart sshd
      service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      service:
        name: fail2ban
        state: restarted
