---
- name: Install Neovim and LSP servers
  hosts: all
  become: true

  vars:
    neovim_build_dir: /tmp/neovim
    lua_ls_install_dir: /usr/local/lua-language-server

    build_deps_fedora:
      - cmake
      - gcc
      - gcc-c++
      - make
      - gettext
      - unzip
      - curl
      - ninja-build

    build_deps_debian:
      - cmake
      - gcc
      - g++
      - make
      - gettext
      - unzip
      - curl
      - ninja-build

    runtime_deps_fedora:
      - ripgrep
      - fzf

    runtime_deps_debian:
      - ripgrep
      - fzf

    lsp_deps_fedora:
      - clang-tools-extra
      - python3-pip

    lsp_deps_debian:
      - clangd
      - python3-pip

  tasks:
    - name: Install build dependencies (Fedora)
      dnf:
        name: "{{ build_deps_fedora }}"
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Install build dependencies (Debian/Ubuntu)
      apt:
        name: "{{ build_deps_debian }}"
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install runtime dependencies (Fedora)
      dnf:
        name: "{{ runtime_deps_fedora }}"
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Install runtime dependencies (Debian/Ubuntu)
      apt:
        name: "{{ runtime_deps_debian }}"
        state: present
      when: ansible_facts["os_family"] == "Debian"

    - name: Fetch latest Neovim stable tag
      uri:
        url: https://api.github.com/repos/neovim/neovim/releases/latest
        return_content: true
      register: neovim_release

    - name: Set Neovim version fact
      set_fact:
        neovim_version: "{{ neovim_release.json.tag_name }}"

    - name: Print Neovim version
      debug:
        msg: "Building Neovim {{ neovim_version }}"

    - name: Clone Neovim source at latest stable tag
      git:
        repo: https://github.com/neovim/neovim.git
        dest: "{{ neovim_build_dir }}"
        version: "{{ neovim_version }}"
        depth: 1
        force: true

    - name: Build Neovim
      make:
        chdir: "{{ neovim_build_dir }}"
        params:
          CMAKE_BUILD_TYPE: RelWithDebInfo

    - name: Install Neovim
      make:
        chdir: "{{ neovim_build_dir }}"
        target: install

    - name: Clean up build directory
      file:
        path: "{{ neovim_build_dir }}"
        state: absent

    # LSP servers used by neovim-minimal/init.lua: lua_ls, clangd, pyright
    - name: Install clangd and pip (Fedora)
      dnf:
        name: "{{ lsp_deps_fedora }}"
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Install clangd and pip (Debian/Ubuntu)
      apt:
        name: "{{ lsp_deps_debian }}"
        state: present
      when: ansible_facts["os_family"] == "Debian"

    - name: Install pyright via pip
      pip:
        name: pyright
        executable: pip3
        extra_args: --break-system-packages

    - name: Fetch latest lua-language-server release
      uri:
        url: https://api.github.com/repos/LuaLS/lua-language-server/releases/latest
        return_content: true
      register: lua_ls_release

    - name: Set lua-language-server version fact
      set_fact:
        lua_ls_version: "{{ lua_ls_release.json.tag_name }}"

    - name: Print lua-language-server version
      debug:
        msg: "Installing lua-language-server {{ lua_ls_version }}"

    - name: Create lua-language-server install directory
      file:
        path: "{{ lua_ls_install_dir }}"
        state: directory
        mode: "0755"

    - name: Download and extract lua-language-server
      unarchive:
        src: "https://github.com/LuaLS/lua-language-server/releases/download/{{ lua_ls_version }}/lua-language-server-{{ lua_ls_version }}-linux-x64.tar.gz"
        dest: "{{ lua_ls_install_dir }}"
        remote_src: true

    - name: Symlink lua-language-server into PATH
      file:
        src: "{{ lua_ls_install_dir }}/bin/lua-language-server"
        dest: /usr/local/bin/lua-language-server
        state: link
