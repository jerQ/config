---
# Optional security hardening for Fedora. Not part of site.yml — run on demand.
# Every section is tagged, so you can pick only what you need:
#   ansible-playbook -i inventory.ini fedora/hardening.yml --tags sysctl,firewall
# Tags: selinux, audit, sysctl, modules, mounts, firewall, ssh, fail2ban, autoupdate
# Try it first with --check --diff. Keep a second SSH session open while
# applying the ssh/firewall tags. A reboot is needed for audit=1, and when
# SELinux was disabled before.
- name: Harden Fedora
  hosts: all
  become: true

  vars:
    # Make audit rules immutable (-e 2) until the next reboot.
    audit_immutable: false
    # High-volume telemetry (every exec, outbound connection, failed file
    # access, file deletion). Only useful when logs are shipped to a SIEM.
    audit_telemetry: false
    # Log every 32-bit syscall. Turn off on hosts that run 32-bit software
    # (Steam, Wine).
    audit_32bit_abi: true
    # Rules about human activity match login UIDs from here up.
    audit_uid_min: 1000
    audit_kernel_args: [audit=1, audit_backlog_limit=8192]
    # auditd.conf: 20 MB x 10 logs = 200 MB. /var/log/audit usually shares
    # the root filesystem here. Warn via syslog at 150 MB free, suspend
    # logging at 75 MB free.
    audit_max_log_file: 20
    audit_num_logs: 10
    audit_space_left: 150
    audit_admin_space_left: 75

    # File and directory watches (perm defaults to wa). A watch is skipped when
    # its directory doesn't exist. Writes to /usr, /bin and /boot are
    # deliberately not watched: every dnf upgrade would flood the log.
    # `rpm -Va` checks installed files against the packages instead.
    audit_watches:
      # Accounts and privilege
      - { path: /etc/passwd, key: identity }
      - { path: /etc/shadow, key: identity }
      - { path: /etc/group, key: identity }
      - { path: /etc/gshadow, key: identity }
      - { path: /etc/subuid, key: identity }
      - { path: /etc/subgid, key: identity }
      - { path: /etc/sudoers, key: privilege }
      - { path: /etc/sudoers.d, dir: true, key: privilege }
      - { path: /etc/login.defs, key: login }
      - { path: /etc/securetty, key: login }
      - { path: /etc/pam.d, dir: true, key: pam }
      - { path: /etc/security, dir: true, key: pam }
      - { path: /etc/polkit-1, dir: true, key: pam }
      # SSH, including host keys and root's authorized_keys
      - { path: /etc/ssh, dir: true, key: sshd }
      - { path: /root/.ssh, dir: true, key: rootkey }
      # Audit itself: also reads of the logs
      - { path: /var/log/audit, dir: true, perm: rwa, key: auditlog }
      - { path: /etc/audit, dir: true, key: auditconfig }
      # Kernel parameters and modules
      - { path: /etc/sysctl.conf, key: sysctl }
      - { path: /etc/sysctl.d, dir: true, key: sysctl }
      - { path: /etc/modprobe.d, dir: true, key: modprobe }
      - { path: /etc/modules-load.d, dir: true, key: modprobe }
      # Boot, init and services
      - { path: /etc/systemd, dir: true, key: systemd }
      - { path: /etc/rc.d/rc.local, key: init }
      - { path: /etc/default, dir: true, key: bootloader }
      - { path: /etc/kernel, dir: true, key: bootloader }
      - { path: /etc/fstab, key: fstab }
      - { path: /etc/udev/rules.d, dir: true, key: udev }
      - { path: /etc/sysconfig, dir: true, key: sysconfig }
      # Scheduled jobs
      - { path: /etc/crontab, key: cron }
      - { path: /etc/cron.d, dir: true, key: cron }
      - { path: /etc/cron.hourly, dir: true, key: cron }
      - { path: /etc/cron.daily, dir: true, key: cron }
      - { path: /etc/cron.weekly, dir: true, key: cron }
      - { path: /etc/cron.monthly, dir: true, key: cron }
      - { path: /etc/anacrontab, key: cron }
      - { path: /var/spool/cron, dir: true, key: cron }
      - { path: /etc/at.allow, key: cron }
      - { path: /etc/at.deny, key: cron }
      # Packages
      - { path: /etc/dnf, dir: true, key: dnf }
      - { path: /etc/yum.repos.d, dir: true, key: dnf }
      # Shells, environment and library search path
      - { path: /etc/profile, key: shell_profiles }
      - { path: /etc/profile.d, dir: true, key: shell_profiles }
      - { path: /etc/bashrc, key: shell_profiles }
      - { path: /etc/zshrc, key: shell_profiles }
      - { path: /etc/shells, key: shell_profiles }
      - { path: /etc/environment, key: shell_profiles }
      - { path: /etc/ld.so.conf, key: libpath }
      - { path: /etc/ld.so.conf.d, dir: true, key: libpath }
      - { path: /etc/ld.so.preload, key: libpath }
      # Network and firewall
      - { path: /etc/hosts, key: network }
      - { path: /etc/hostname, key: network }
      - { path: /etc/resolv.conf, key: network }
      - { path: /etc/NetworkManager, dir: true, key: network }
      - { path: /etc/firewalld, dir: true, key: firewall }
      - { path: /etc/fail2ban, dir: true, key: firewall }
      # Mandatory access control
      - { path: /etc/selinux, dir: true, key: mac_policy }
      # Time zone
      - { path: /etc/localtime, key: localtime }

    blacklisted_modules: [dccp, sctp, rds, tipc, cramfs, freevxfs, jffs2, hfs, hfsplus]

    # firewalld zone to use as default. FedoraWorkstation opens ports
    # 1025-65535 to the network; public only allows ssh, mdns, dhcpv6-client.
    firewall_zone: public
    # Extra inbound TCP ports to open in that zone. Keep your SSH port here!
    firewall_allowed_tcp: [22]

    fail2ban_bantime: 1h
    fail2ban_findtime: 10m
    fail2ban_maxretry: 5

    # dnf5-automatic: "security" for security updates only, "default" for all.
    autoupdate_type: security

    audit_arch: "b{{ ansible_facts['userspace_bits'] | default('64') }}"
    reboot_required: false

  tasks:
    # ------------------------------------------------------------------- selinux
    # Fedora's MAC is SELinux (not AppArmor). It's enforcing by default; this
    # makes sure nobody has turned it off.
    - name: SELinux
      tags: [selinux]
      block:
        - name: Install SELinux tools
          dnf:
            name: [policycoreutils, policycoreutils-python-utils, python3-libselinux]
            state: present

        - name: Set SELinux to enforcing (targeted policy)
          ansible.posix.selinux:
            policy: targeted
            state: enforcing
          register: selinux_result

        - name: Mark reboot as required (SELinux was disabled)
          set_fact:
            reboot_required: true
          when: selinux_result.reboot_required | default(false)

    # -------------------------------------------------------------------- sysctl
    - name: Write sysctl hardening
      tags: [sysctl]
      copy:
        dest: /etc/sysctl.d/90-hardening.conf
        mode: "0644"
        content: |
          # Managed by ansible (fedora/hardening.yml)
          # User namespaces stay enabled: rootless podman needs them.
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.unprivileged_bpf_disabled = 1
          net.core.bpf_jit_harden = 2
          kernel.yama.ptrace_scope = 1
          kernel.kexec_load_disabled = 1
          fs.protected_hardlinks = 1
          fs.protected_symlinks = 1
          fs.protected_fifos = 2
          fs.protected_regular = 2
          fs.suid_dumpable = 0

          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.default.log_martians = 1
          net.ipv4.tcp_syncookies = 1
          net.ipv4.icmp_echo_ignore_broadcasts = 1

          net.ipv6.conf.all.accept_redirects = 0
          net.ipv6.conf.default.accept_redirects = 0
          net.ipv6.conf.all.accept_source_route = 0
          net.ipv6.conf.default.accept_source_route = 0
      notify: Reload sysctl

    # ------------------------------------------------------------------- modules
    - name: Block unused kernel modules
      tags: [modules]
      copy:
        dest: /etc/modprobe.d/hardening.conf
        mode: "0644"
        content: |
          # Managed by ansible (fedora/hardening.yml)
          {% for mod in blacklisted_modules %}
          install {{ mod }} /bin/false
          {% endfor %}

    # -------------------------------------------------------------------- mounts
    - name: Mount /dev/shm with nosuid,nodev,noexec
      tags: [mounts]
      lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+/dev/shm\s'
        line: "tmpfs /dev/shm tmpfs nosuid,nodev,noexec 0 0"
      notify: Remount /dev/shm

    # ------------------------------------------------------------------ firewall
    # Fedora manages nftables through firewalld; writing raw nftables rules
    # next to it would conflict, so harden firewalld instead.
    - name: Firewall
      tags: [firewall]
      block:
        - name: Install firewalld
          dnf:
            name: firewalld
            state: present

        - name: Enable and start firewalld
          service:
            name: firewalld
            enabled: true
            state: started

        # Open the ports before switching zones so SSH never gets blocked.
        - name: Allow inbound TCP ports in the zone
          ansible.posix.firewalld:
            zone: "{{ firewall_zone }}"
            port: "{{ item }}/tcp"
            permanent: true
            immediate: true
            state: enabled
          loop: "{{ firewall_allowed_tcp }}"

        - name: Read default zone
          command: firewall-cmd --get-default-zone
          register: firewalld_zone
          changed_when: false
          check_mode: false

        - name: Set default zone
          command: firewall-cmd --set-default-zone={{ firewall_zone }}
          when: firewalld_zone.stdout != firewall_zone

    # ----------------------------------------------------------------------- ssh
    - name: SSH
      tags: [ssh]
      block:
        # Lockout guard: key-only login needs a key to log in with.
        - name: Check authorized_keys of the login user
          stat:
            path: ~/.ssh/authorized_keys
          become: false
          register: authorized_keys

        - name: Refuse to disable password login without authorized_keys
          assert:
            that:
              - authorized_keys.stat.exists
              - authorized_keys.stat.size > 0
            fail_msg: "~/.ssh/authorized_keys is missing or empty. Add a key first, or you'll be locked out."

        - name: Install OpenSSH server
          dnf:
            name: openssh-server
            state: present

        # sshd uses the first value it sees, so the drop-ins must be included first.
        # Fedora already has this line at the top; this only guards older configs.
        # 10-hardening.conf sorts before Fedora's 50-redhat.conf, so it wins.
        - name: Include sshd_config.d at the top of sshd_config
          lineinfile:
            path: /etc/ssh/sshd_config
            line: "Include /etc/ssh/sshd_config.d/*.conf"
            insertbefore: BOF
            validate: sshd -t -f %s
          notify: Restart sshd

        - name: Write sshd hardening drop-in
          copy:
            dest: /etc/ssh/sshd_config.d/10-hardening.conf
            mode: "0600"
            validate: sshd -t -f %s
            content: |
              # Managed by ansible (fedora/hardening.yml)
              PermitRootLogin no
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              PubkeyAuthentication yes
              X11Forwarding no
              MaxAuthTries 3
              LoginGraceTime 30
          notify: Restart sshd

        - name: Enable and start sshd
          service:
            name: sshd
            enabled: true
            state: started

    # ------------------------------------------------------------------ fail2ban
    - name: Fail2ban
      tags: [fail2ban]
      block:
        # fail2ban-firewalld makes firewalld the ban action.
        - name: Install fail2ban
          dnf:
            name: [fail2ban-server, fail2ban-firewalld]
            state: present

        - name: Configure sshd jail
          copy:
            dest: /etc/fail2ban/jail.d/sshd.local
            mode: "0644"
            content: |
              # Managed by ansible (fedora/hardening.yml)
              [sshd]
              enabled = true
              backend = systemd
              bantime = {{ fail2ban_bantime }}
              findtime = {{ fail2ban_findtime }}
              maxretry = {{ fail2ban_maxretry }}
          notify: Restart fail2ban

        - name: Enable and start fail2ban
          service:
            name: fail2ban
            enabled: true
            state: started

    # ---------------------------------------------------------------- autoupdate
    - name: Automatic updates
      tags: [autoupdate]
      block:
        - name: Install dnf5-automatic
          dnf:
            name: dnf5-plugin-automatic
            state: present

        - name: Configure dnf5-automatic to apply updates
          copy:
            dest: /etc/dnf/dnf5-plugins/automatic.conf
            mode: "0644"
            content: |
              # Managed by ansible (fedora/hardening.yml)
              [commands]
              upgrade_type = {{ autoupdate_type }}
              apply_updates = yes
              reboot = never

              [emitters]
              emit_via = stdio

        - name: Enable dnf5-automatic timer
          service:
            name: dnf5-automatic.timer
            enabled: true
            state: started

    # --------------------------------------------------------------------- audit
    # Runs last: watches are only added for directories that exist, and the
    # sections above create some of them (/etc/fail2ban).
    - name: Audit
      tags: [audit]
      block:
        - name: Install audit
          dnf:
            name: [audit, audit-rules]
            state: present

        # Fedora installs 10-no-audit.rules (-a task,never) as audit.rules,
        # which turns off all syscall auditing. Replace it with the base config.
        - name: Replace Fedora's no-audit default rules with the base config
          copy:
            src: /usr/share/audit-rules/10-base-config.rules
            dest: /etc/audit/rules.d/audit.rules
            remote_src: true
            mode: "0640"
          notify: Load audit rules

        - name: Check which watched directories exist
          stat:
            path: "{{ item.path if item.dir | default(false) else item.path | dirname }}"
          loop: "{{ audit_watches }}"
          loop_control:
            label: "{{ item.path }}"
          register: audit_watch_stat

        - name: Write audit rules
          template:
            src: ../common/audit-hardening.rules.j2
            dest: /etc/audit/rules.d/50-hardening.rules
            mode: "0640"
          vars:
            audit_playbook: fedora/hardening.yml
          notify: Load audit rules

        - name: Size audit log retention
          lineinfile:
            path: /etc/audit/auditd.conf
            regexp: '^{{ item.key }}\s*='
            line: "{{ item.key }} = {{ item.value }}"
          loop:
            - { key: max_log_file, value: "{{ audit_max_log_file }}" }
            - { key: num_logs, value: "{{ audit_num_logs }}" }
            - { key: max_log_file_action, value: ROTATE }
            - { key: space_left, value: "{{ audit_space_left }}" }
            - { key: space_left_action, value: SYSLOG }
            - { key: admin_space_left, value: "{{ audit_admin_space_left }}" }
            - { key: admin_space_left_action, value: SUSPEND }
          loop_control:
            label: "{{ item.key }}"
          notify: Reload auditd config

        - name: Enable and start auditd
          service:
            name: auditd
            enabled: true
            state: started

        # audit=1 lets processes started before auditd be audited too. Without
        # a bigger backlog, the kernel drops events from early boot.
        - name: Read default kernel cmdline
          command: grubby --info=DEFAULT
          register: grubby_info
          changed_when: false
          check_mode: false

        - name: Add audit options to all kernels
          command: grubby --update-kernel=ALL --args="{{ audit_kernel_args | join(' ') }}"
          when: audit_kernel_args | reject('in', grubby_info.stdout) | list | length > 0
          register: grubby_update

        - name: Mark reboot as required (kernel cmdline changed)
          set_fact:
            reboot_required: true
          when: grubby_update is changed

    # ------------------------------------------------------------------- summary
    - name: Reboot reminder
      tags: [always]
      debug:
        msg: "Reboot required: kernel command line (audit options) or SELinux state changed."
      when: reboot_required | bool

  handlers:
    - name: Load audit rules
      command: augenrules --load

    # SIGHUP makes auditd re-read auditd.conf
    - name: Reload auditd config
      command: pkill -HUP -x auditd

    - name: Reload sysctl
      command: sysctl -e -p /etc/sysctl.d/90-hardening.conf

    - name: Remount /dev/shm
      command: mount -o remount,nosuid,nodev,noexec /dev/shm

    - name: Restart sshd
      service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      service:
        name: fail2ban
        state: restarted
