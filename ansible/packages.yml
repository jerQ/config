---
- name: Install common packages
  hosts: all
  become: true

  vars:
    packages_fedora:
      - git
      - gh
      - curl
      - fzf
      - fd-find
      - zoxide
      - ripgrep
      - tree
      - tmux
      - bat
      - cmake
      - make
      - gcc
      - gcc-c++
      - autoconf
      - automake
      - golang
      - cargo
      - python3
      - ansible
      - podman
      - doctl
      - keepassxc
      - neovim

    packages_debian:
      - git
      - gh
      - curl
      - fzf
      - fd-find
      - zoxide
      - ripgrep
      - tree
      - tmux
      - bat
      - cmake
      - make
      - gcc
      - g++
      - autoconf
      - automake
      - golang-go
      - cargo
      - python3
      - ansible
      - podman
      - keepassxc
      - neovim

  tasks:
    - name: Install packages (Fedora)
      dnf:
        name: "{{ packages_fedora }}"
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Install packages (Debian/Ubuntu)
      apt:
        name: "{{ packages_debian }}"
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install starship
      shell: curl -sS https://starship.rs/install.sh | sh -s -- --yes --bin-dir "{{ ansible_env.HOME }}/.local/bin"
      args:
        creates: "{{ ansible_env.HOME }}/.local/bin/starship"
      become: false

